apiVersion: v1
kind: ConfigMap
metadata:
  name: app-configmap
  namespace: practica-s11
  labels:
    app: backend-webflux
    environment: practice
    session: s11
data:
  # Nombre DNS del servicio interno de MongoDB (ClusterIP)
  DB_HOST: "mongo-service"
  
  # Puerto oficial de escucha de MongoDB
  DB_PORT: "27017"
  
  # Nombre de la base de datos de producción
  DB_NAME: "proddb"
  
  # Puerto donde escucha el Backend Spring WebFlux
  APP_PORT: "8080"

