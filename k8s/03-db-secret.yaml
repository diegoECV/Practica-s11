apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s11
  labels:
    app: backend-webflux
    tier: database
    session: s11
type: Opaque
data:
  # Usuario root: 'admin' -> echo -n "admin" | base64
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=

  # Contraseña segura: 'SecretPassword2024!' -> echo -n "SecretPassword2024!" | base64
  MONGO_INITDB_ROOT_PASSWORD: U2VjcmV0UGFzc3dvcmQyMDI0IQ==

