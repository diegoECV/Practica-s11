# ==============================================================================
# MANIFIESTO: 05-backend-stack.yaml
# DESCRIPCIÓN: Deployment de Backend Spring WebFlux (envFrom + Probes) y Service NodePort
# ==============================================================================

# 1. DEPLOYMENT DEL BACKEND REACTIVO (SPRING WEBFLUX)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s11
  labels:
    app: backend-webflux
    tier: backend
    session: s11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-webflux
  template:
    metadata:
      labels:
        app: backend-webflux
        tier: backend
    spec:
      containers:
        - name: backend-webflux
          image: backend-webflux:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-port
          # Consumo simultáneo mediante la directiva envFrom (ConfigMap + Secret)
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: db-secret
          # Sondas de salud apuntando al endpoint de Actuator
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# 2. SERVICIO NODEPORT PARA EL BACKEND REACTIVO
# Permite el acceso y consumo externo de las APIs REST
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s11
  labels:
    app: backend-webflux
    tier: backend
    session: s11
spec:
  type: NodePort
  selector:
    app: backend-webflux
  ports:
    - name: http
      protocol: TCP
      port: 8080        # Puerto interno del servicio
      targetPort: 8080  # Puerto donde escucha el contenedor Spring WebFlux
      # Kubernetes asignará automáticamente un NodePort libre sin colisiones

