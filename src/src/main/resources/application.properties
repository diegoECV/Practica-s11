# Configuración del servidor reactivo
server.port=${APP_PORT:8080}

# Configuración reactiva de MongoDB
# Lee variables de entorno inyectadas desde ConfigMap y Secret vía envFrom
spring.data.mongodb.host=${DB_HOST:mongo-service}
spring.data.mongodb.port=${DB_PORT:27017}
spring.data.mongodb.database=${DB_NAME:proddb}
spring.data.mongodb.username=${MONGO_INITDB_ROOT_USERNAME:admin}
spring.data.mongodb.password=${MONGO_INITDB_ROOT_PASSWORD:SecretPassword2024!}
spring.data.mongodb.authentication-database=admin

# Exposición y configuración de Actuator (Sondas Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo
management.endpoint.health.group.liveness.include=livenessState

